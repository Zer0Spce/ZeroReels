[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroreels"
version = "0.3.0"
description = "Free local-first AI short-form video automation for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7,<7",
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
zeroreels = "zeroreels.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
