[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroreels"
version = "0.11.8"
description = "AI short-form video automation for Windows using browser-based ChatGPT and ElevenLabs, local AI, and automatic B-roll"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.7,<7",
  "imageio-ffmpeg>=0.5,<1",
  "kokoro-onnx>=0.5,<1",
  "soundfile>=0.13,<1",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7", "pillow>=10,<13"]

[project.scripts]
zeroreels = "zeroreels.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
