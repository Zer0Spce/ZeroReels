name: Materialize v0.4

on:
  push:
    branches: ["dev/v0.4-real-pipeline"]
    paths:
      - "tools/.v04_ready"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize v0.4 source tree
        run: python tools/materialize_v04.py
      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize ZeroReels v0.4 real pipeline"
          git push origin HEAD:${{ github.ref_name }}
